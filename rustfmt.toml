# Brightflow rustfmt configuration: only the settings that differ from the
# defaults. The edition comes from Cargo.toml via `cargo fmt`.

match_block_trailing_comma = true
newline_style = "Unix"
# Not a no-op in rustfmt 1.9: it changes how some long method chains are
# laid out, and the tree is formatted with it on.
use_try_shorthand = true

[package]
name = "brightflow-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
# Auth framework
axum-login = "0.16"
tower-sessions = "0.13"
tower-sessions-sqlx-store = { version = "0.14", features = ["sqlite"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Password hashing
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }

# Async
async-trait = "0.1"
tokio = { workspace = true }

# Serialization
serde = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

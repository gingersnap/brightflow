[package]
name = "brightflow-insights"
version = "0.1.0"
edition = "2021"
description = "A CLI tool that analyzes CSV data to find statistical insights"

[lib]
name = "brightflow_insights"
path = "src/lib.rs"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
clap = { version = "4.5", features = ["derive"] }
polars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
statrs = "0.18"
chrono = { workspace = true }
anyhow = "1.0"
thiserror = { workspace = true }

[lints]
workspace = true

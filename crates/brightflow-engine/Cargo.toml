[package]
name = "brightflow-engine"
version = "0.1.0"
edition = "2021"
description = "Analysis engine and NLP primitives for Brightflow"

[lib]
name = "brightflow_engine"
path = "src/lib.rs"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
polars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
statrs = "0.18"
chrono = { workspace = true }
anyhow = "1.0"
thiserror = { workspace = true }
unicode-segmentation = "1.12"
regex = "1.12"
bincode = "1.3"
tracing = { workspace = true }
ts-rs = { workspace = true }
model2vec-rs = "0.1"
once_cell = "1.21"
stop-words = "0.8"
hdbscan = "0.12"
# Cold-path classifier training. Pure Rust by default (0.6.0 dropped the
# mandatory BLAS); inference is hand-rolled, so linfa never reaches the hot path
# and its types never enter a persisted artifact.
linfa = "0.7"
linfa-logistic = "0.7"
ndarray = "0.15"

[lints]
workspace = true

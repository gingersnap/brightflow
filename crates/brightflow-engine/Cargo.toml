[package]
name = "brightflow-engine"
version = "0.1.0"
edition = "2021"
description = "Analysis engine and NLP primitives for Brightflow"

[lib]
name = "brightflow_engine"
path = "src/lib.rs"

[dependencies]
# The contract crate: role/polarity/granularity and the semantic model.
brightflow-types = { path = "../brightflow-types", features = ["polars"] }
# Pre-call language identification for ticket enrichment (nlp::language).
whatlang = "0.16"
polars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
statrs = "0.18"
chrono = { workspace = true }
anyhow = "1.0"
thiserror = { workspace = true }
unicode-segmentation = "1.12"
regex = "1.12"
blake3 = "1"
tracing = { workspace = true }
ts-rs = { workspace = true }
stop-words = "0.8"

[lints]
workspace = true

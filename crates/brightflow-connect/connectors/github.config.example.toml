# GitHub Connector Configuration
# Copy this file to github.config.toml and fill in your values

# GitHub Personal Access Token
# Create one at: https://github.com/settings/tokens
# Required scopes: repo (for private repos) or public_repo (for public only)
# Can also be set via GITHUB_TOKEN environment variable
token = "${GITHUB_TOKEN}"

# Repository owner (organization or username)
owner = "anthropics"

# Repository name
repo = "claude-code"

# Output path for Parquet files
# Each endpoint creates a separate file: repository.parquet, issues.parquet, etc.
output_path = "./data/github"

[package]
name = "brightflow-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "brightflow"
path = "src/main.rs"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
brightflow-connect = { path = "../brightflow-connect" }
brightflow-store = { path = "../brightflow-store" }
brightflow-insights = { path = "../brightflow-insights" }
brightflow-api = { path = "../brightflow-api" }

# CLI
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Environment
dotenvy = { workspace = true }

# Data
polars = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

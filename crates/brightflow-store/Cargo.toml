[package]
name = "brightflow-store"
version = "0.1.0"
edition = "2021"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
tokio = { workspace = true }
polars = { workspace = true, features = ["semi_anti_join"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
blake3 = "1"
deadpool-sqlite = "0.13"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
brightflow-test-support = { path = "../brightflow-test-support" }

[lints]
workspace = true

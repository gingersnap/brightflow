[package]
name = "brightflow-store"
version = "0.1.0"
edition = "2021"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
tokio = { workspace = true }
polars = { workspace = true, features = ["semi_anti_join"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

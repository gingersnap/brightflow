[package]
name = "brightflow-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "brightflow_api"
path = "src/lib.rs"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
brightflow-store = { path = "../brightflow-store" }
brightflow-connect = { path = "../brightflow-connect" }
brightflow-insights = { path = "../brightflow-insights" }
brightflow-scheduler = { path = "../brightflow-scheduler" }
brightflow-ingest = { path = "../brightflow-ingest" }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
time = "0.3"

# Auth framework
axum-login = "0.18"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Password hashing
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }

# Data processing
polars = { workspace = true }

# Concurrency
dashmap = "6"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
dotenvy = { workspace = true }
anyhow = "1.0"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true }

[lints]
workspace = true

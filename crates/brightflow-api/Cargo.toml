[package]
name = "brightflow-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "brightflow_api"
path = "src/lib.rs"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
brightflow-store = { path = "../brightflow-store" }
brightflow-connect = { path = "../brightflow-connect" }
brightflow-engine = { path = "../brightflow-engine" }
brightflow-llm = { path = "../brightflow-llm" }
brightflow-scheduler = { path = "../brightflow-scheduler" }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
time = "0.3"

# Auth framework
axum-login = "0.18"
tower-sessions = "0.14"
# deletion-task lives on -core and is not forwarded by tower-sessions; this
# line only turns the feature on (continuously_delete_expired for the sweeper).
tower-sessions-core = { version = "0.14", features = ["deletion-task"] }
async-trait = "0.1"
rmp-serde = "1"

# Database

# Password hashing
argon2 = "0.5"

# Data processing
polars = { workspace = true }

# Concurrency
dashmap = "6"
schemars = "1"

# Ingest dependencies
blake3 = "1"
maxminddb = "0.27"
uaparser = "0.6"
url = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
anyhow = "1.0"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
brightflow-test-support = { path = "../brightflow-test-support" }

[lints]
workspace = true

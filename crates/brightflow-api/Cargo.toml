[package]
name = "brightflow-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "brightflow_api"
path = "src/lib.rs"

[dependencies]
brightflow-core = { path = "../brightflow-core" }
brightflow-store = { path = "../brightflow-store" }
brightflow-insights = { path = "../brightflow-insights" }
brightflow-scheduler = { path = "../brightflow-scheduler" }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Data processing
polars = { workspace = true }

# Concurrency
dashmap = "6"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
dotenvy = { workspace = true }
anyhow = "1.0"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package]
name = "subtext"
version = "0.1.0"
edition = "2021"
description = "Lightweight NLP primitives: tokenization, TF-IDF, cosine similarity"

[dependencies]
thiserror = { workspace = true }
unicode-segmentation = "1.12"
regex = "1.12"

[dependencies.serde]
workspace = true
optional = true

[dependencies.polars]
workspace = true
optional = true

[dependencies.bincode]
version = "1.3"
optional = true

[features]
default = []
serde = ["dep:serde"]
polars = ["dep:polars", "dep:bincode", "serde"]

[dev-dependencies]
serde_json = { workspace = true }
polars = { workspace = true }
bincode = "1.3"

[lints]
workspace = true

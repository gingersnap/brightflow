[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Shared dependencies for consistency
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
polars = { version = "0.48", features = ["lazy", "csv", "json", "parquet", "pivot", "dtype-date", "strings", "regex"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl", "serde-json-impl"] }
dotenvy = "0.15"
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"

# ===========================================
# Workspace Lint Configuration
# ===========================================

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"  # Enable later when adding documentation
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
unused_must_use = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
# Lint groups
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }

# Denials - panic/error handling
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"  # Some panics are intentional in unreachable code
unwrap_in_result = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"

# Denials - safety
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
float_cmp_const = "deny"
error_impl_error = "deny"

# Warnings - code quality
indexing_slicing = "warn"
wildcard_imports = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
string_add = "warn"
string_add_assign = "warn"

# Allows - overly noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"

name: "GitHub Pull Requests"
description: "Pull requests with code change metrics and review activity"

settings:
  time_granularity: week
  comparison_periods: 4

columns:
  - name: created_at
    type: time
    label: "Created At"
  - name: additions
    type: kpi
    label: "Lines Added"
  - name: deletions
    type: kpi
    label: "Lines Deleted"
  - name: changed_files
    type: kpi
    label: "Files Changed"
  - name: commits
    type: metric
    label: "Commits"
  - name: comments
    type: metric
    label: "Comments"
  - name: review_comments
    type: metric
    label: "Review Comments"
  - name: state
    type: dimension
    label: "State"
  - name: draft
    type: dimension
    label: "Draft"
  - name: author_association
    type: dimension
    label: "Author Association"
  - name: user_login
    type: dimension
    label: "Author"
  - name: base_ref
    type: dimension
    label: "Base Branch"
  - name: merged_by_login
    type: dimension
    label: "Merged By"
  - name: label_names
    type: dimension
    label: "Labels"
  - name: id
    type: ignored
  - name: number
    type: ignored
  - name: title
    type: ignored
  - name: body
    type: ignored
  - name: html_url
    type: ignored
  - name: updated_at
    type: ignored
  - name: closed_at
    type: ignored
  - name: merged_at
    type: ignored
  - name: head_ref
    type: ignored
  - name: head_sha
    type: ignored
  - name: base_sha
    type: ignored
  - name: merge_commit_sha
    type: ignored
  - name: milestone_title
    type: ignored
  - name: reviewer_logins
    type: ignored
  - name: user_id
    type: ignored

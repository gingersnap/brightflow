[env]
TS_RS_EXPORT_DIR = { value = "brightflow-app/src/types/generated", relative = true }
# jemalloc returns freed pages to the OS immediately instead of holding dirty
# pages for ~10s. With tokio's async workload and frequent dataset switches the
# default made RSS grow, because the old dataset's pages had not been returned
# before the new one loaded. Baked in at build time (jemalloc's malloc_conf),
# so no runtime `unsafe` mallctl call is needed; changing it rebuilds jemalloc.
JEMALLOC_SYS_WITH_MALLOC_CONF = "dirty_decay_ms:0,muzzy_decay_ms:0"
